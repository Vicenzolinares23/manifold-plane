[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-plane-agent"
version = "0.1.0"
description = "Agentic layer for manifold-plane: LangGraph agent gated by the Rust trajectory-based admission engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
training = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.9",
    "datasets>=2.20",
    "accelerate>=0.33",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
mp-agent-demo = "manifold_agent.examples.demo_agent:main"
mp-train = "manifold_agent.training.train:main"
mp-eval = "manifold_agent.training.eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manifold_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
